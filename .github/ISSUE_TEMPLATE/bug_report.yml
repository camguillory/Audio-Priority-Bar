name: Bug report
description: Tell us what went wrong with Audio Priority Bar
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For first-launch or permission questions, check [Install](https://github.com/camguillory/Audio-Priority-Bar#install) and [Permissions](https://github.com/camguillory/Audio-Priority-Bar#permissions).

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        In **Settings > App**, click **Copy Diagnostics** and paste here. It includes your app and macOS versions, settings, device lists, and recent switches, with owner names, Bluetooth addresses, serial numbers, and display IDs replaced by short tags. If the app won't open, write your app and macOS versions instead.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Debug log or screenshots
      description: |
        For a switching problem, turn on **Keep a debug log** in **Settings > App**, make it happen again, click **Export Redacted Log**, and drag the file from Downloads here. You can also attach screenshots or crash reports from `~/Library/Logs/DiagnosticReports/`.
