name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: "26.6"

      - name: Validate and check out tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release already exists for $TAG." >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
          version="${TAG#v}"
          echo "VERSION=${version%%-*}" >> "$GITHUB_ENV"

      - name: Test core
        run: swift test --package-path AudioPriorityCore

      - name: Test app
        run: |
          xcodebuild test \
            -project AudioPriorityBar.xcodeproj \
            -scheme AudioPriorityBar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and verify release artifact
        run: scripts/package-release.sh "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Validate release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi

      - name: Create release draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: .github/release-notes/${{ inputs.tag }}.md
          files: |
            release/AudioPriorityBar.zip
            release/AudioPriorityBar.zip.sha256
          draft: true
          prerelease: ${{ inputs.prerelease }}
          # Curated notes above are the complete release body.
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
