name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: "26.6"

      - name: Validate and check out tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG"
          if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main; then
            echo "$TAG is not on main. Promote it through the release pull request first." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release already exists for $TAG." >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
          version="${TAG#v}"
          echo "VERSION=${version%%-*}" >> "$GITHUB_ENV"

      - name: Validate release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi

      - name: Test core
        run: swift test --package-path AudioPriorityCore

      - name: Test app
        run: |
          xcodebuild test \
            -project AudioPriorityBar.xcodeproj \
            -scheme AudioPriorityBar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CODESIGN_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "The CODESIGN_CERTIFICATE_P12 and CODESIGN_CERTIFICATE_PASSWORD secrets are required." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

      - name: Download previous releases for delta updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous="$RUNNER_TEMP/previous"
          mkdir -p "$previous"
          # ponytail: deltas from the last three releases only; Macs further
          # behind download the full archive instead.
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 3 \
              --json tagName --jq '.[].tagName'); do
            gh release download "$tag" -p AudioPriorityBar.zip -O "$previous/$tag.zip"
          done
          echo "PREVIOUS_RELEASES=$previous" >> "$GITHUB_ENV"

      - name: Build and verify release artifact
        env:
          REQUIRE_SIGNING_CERTIFICATE: "1"
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "The SPARKLE_PRIVATE_KEY secret is required to sign updates." >&2
            exit 1
          fi
          # The run number is the build number Sparkle compares, so it must
          # keep rising from one release to the next.
          scripts/package-release.sh "$VERSION" "$GITHUB_RUN_NUMBER"
          test -s release/appcast.xml

      - name: Create release draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: .github/release-notes/${{ inputs.tag }}.md
          files: |
            release/AudioPriorityBar.zip
            release/AudioPriorityBar.zip.sha256
            release/AudioPriorityBar-update.zip
            release/AudioPriorityBar-from-*.delta
            release/appcast.xml
          draft: true
          prerelease: ${{ inputs.prerelease }}
          # Curated notes above are the complete release body.
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
